
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  {%- if site.goatcounter and jekyll.environment == 'production' %}
  <!-- Mesure d'audience GoatCounter, sans cookie (remplace Universal Analytics, fermé par Google en 2023) -->
  <script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  {%- endif %}
  <!--mathjax start-->
  <script type="text/x-mathjax-config">
   MathJax.Hub.Config({
     tex2jax: {
       inlineMath: [ ['$','$'], ["\\(","\\)"] ],
       processEscapes: true
     },
    TeX: {
       equationNumbers: { autoNumber: "AMS" }
    }
   });
  </script>

</head>
